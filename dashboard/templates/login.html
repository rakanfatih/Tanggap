<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BPBD Tanggap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 3rem 2rem;
            width: 100%;
            max-width: 400px;
        }
        .brand-logo {
            color: #06b6d4;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

<div class="login-card text-center border-0">
    <div class="brand-logo">
        <i class="fa-solid fa-shield-halved fa-4x"></i>
    </div>
    <h4 class="fw-bold text-dark mb-4">Posko BPBD Tanggap</h4>

    {% if error %}
    <div class="alert alert-danger small py-2 rounded-3" role="alert">
        <i class="fa-solid fa-circle-exclamation me-1"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login">
        <div class="form-floating mb-3 text-start">
            <input type="text" class="form-control bg-light border-0" id="username" name="username" placeholder="Username" required>
            <label for="username" class="text-muted"><i class="fa-solid fa-user me-2"></i>Username</label>
        </div>
        <div class="form-floating mb-4 text-start">
            <input type="password" class="form-control bg-light border-0" id="password" name="password" placeholder="Password" required>
            <label for="password" class="text-muted"><i class="fa-solid fa-lock me-2"></i>Password</label>
        </div>
        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2 shadow-sm" style="background-color: #06b6d4; border: none;">
            Masuk <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
        </button>
    </form>
</div>

</body>
</html>
